name: Publish INS Scene Studio
on:
  push:
    branches: [main]
    paths:
      - 'ins-scene-studio/**'
      - '.github/workflows/deploy-ins-studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ins-scene-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload INS Scene Studio
        uses: actions/upload-pages-artifact@v4
        with:
          path: './ins-scene-studio'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
